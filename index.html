<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xiaomi Store Arequipa</title>
  <!-- Iconos de FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* --- CSS ESTILOS BASE Y DISEÑO RESPONSIVO --- */
    :root {
      --primary-color: #ff6900;
      --primary-hover: #e05d00;
      --bg-dark: #121212;
      --card-bg: #1e1e1e;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #374151;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); padding-bottom: 40px; }

    header {
      background-color: #000;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 2px solid var(--primary-color);
    }

    .logo { font-size: 1.4rem; font-weight: 700; color: #fff; }
    .logo span { color: var(--primary-color); }

    .cart-btn-header {
      background: var(--primary-color);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .container { max-width: 1100px; margin: 20px auto; padding: 0 15px; }
    h1 { margin-bottom: 8px; font-size: 1.8rem; }
    p.sub { color: var(--text-muted); margin-bottom: 20px; }

    /* Filtros y Controles */
    .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .controls input, .controls select {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: #fff;
      font-size: 0.9rem;
    }
    .controls input { flex: 1; min-width: 200px; }

    /* Grilla de Productos */
    .grid-productos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-4px); }
    .card img { width: 100%; height: 160px; object-fit: contain; background: #2a2a2a; border-radius: 6px; margin-bottom: 10px; }
    .card h3 { font-size: 1rem; margin-bottom: 6px; }
    .card .categoria { font-size: 0.75rem; color: var(--primary-color); text-transform: uppercase; font-weight: bold; }
    .card .precio { font-size: 1.2rem; font-weight: bold; margin: 10px 0; }
    
    .btn-add {
      background: var(--primary-color);
      color: #fff;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    .btn-add:hover { background: var(--primary-hover); }

    /* Modal Carrito / Facturación */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 200;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--card-bg);
      border-radius: 10px;
      width: 100%;
      max-width: 500px;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid var(--border-color);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
    .btn-close { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }

    .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #2a2a2a; padding-bottom: 8px; }
    .cart-total { font-size: 1.2rem; font-weight: bold; text-align: right; margin: 15px 0; color: var(--primary-color); }

    /* Formulario de Datos */
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: var(--text-muted); }
    .form-group input, .form-group select {
      width: 100%; padding: 8px 10px; border-radius: 6px;
      border: 1px solid var(--border-color); background: #121212; color: #fff;
    }

    .btn-submit {
      width: 100%;
      background: #25d366;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-submit:hover { background: #1eb857; }
  </style>
</head>
<body>

  <header>
    <div class="logo">Xiaomi <span>Arequipa</span></div>
    <button class="cart-btn-header" onclick="abrirModal()">
      <i class="fa-solid fa-cart-shopping"></i> Carrito (<span id="cart-count">0</span>)
    </button>
  </header>

  <div class="container">
    <h1>Catálogo de Productos</h1>
    <p class="sub">Encuentra la mejor tecnología Xiaomi con entrega directa en Arequipa.</p>

    <!-- Controles de búsqueda y filtro -->
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Buscar producto..." oninput="filtrarCatálogo()">
      <select id="categoryFilter" onchange="filtrarCatálogo()">
        <option value="todas">Todas las categorías</option>
        <option value="smartphones">Smartphones</option>
        <option value="wearables">Wearables</option>
        <option value="audio">Audio</option>
        <option value="hogar">Smart Home / Hogar</option>
      </select>
    </div>

    <!-- Grilla donde se renderizan los 20 productos -->
    <div id="gridProductos" class="grid-productos"></div>
  </div>

  <!-- Modal Checkout / Comprobante -->
  <div id="modalCart" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2><i class="fa-solid fa-bag-shopping"></i> Tu Pedido</h2>
        <button class="btn-close" onclick="cerrarModal()">&times;</button>
      </div>

      <div id="cartList"></div>
      <div class="cart-total" id="cartTotal">Total: S/ 0.00</div>

      <form id="orderForm" onsubmit="enviarWhatsApp(event)">
        <h3 style="font-size: 0.95rem; margin-bottom: 10px;">Datos de Facturación / Envío</h3>
        
        <div class="form-group">
          <label for="tipoDoc">Tipo de Comprobante</label>
          <select id="tipoDoc" required>
            <option value="Boleta">Boleta (Persona Natural)</option>
            <option value="Factura">Factura (Empresa / RUC)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="numDoc">DNI o RUC</label>
          <input type="text" id="numDoc" placeholder="Ej. 10456789012" required maxlength="11">
        </div>

        <div class="form-group">
          <label for="nombreCliente">Nombre / Razón Social</label>
          <input type="text" id="nombreCliente" placeholder="Tu nombre o empresa" required>
        </div>

        <button type="submit" class="btn-submit">
          <i class="fa-brands fa-whatsapp"></i> Confirmar y Enviar a WhatsApp
        </button>
      </form>
    </div>
  </div>

  <!-- --- JAVASCRIPT LÓGICA DE TIENDA Y COMPRA --- -->
  <script>
    // Catálogo inicial de 20 productos de Xiaomi Arequipa
    const productos = [
      { id: 1, nombre: "Xiaomi 13T Pro", categoria: "smartphones", precio: 2899, img: "https://via.placeholder.com/200?text=13T+Pro" },
      { id: 2, nombre: "Redmi Note 13 Pro 5G", categoria: "smartphones", precio: 1299, img: "https://via.placeholder.com/200?text=Note+13+Pro" },
      { id: 3, nombre: "Poco X6 Pro", categoria: "smartphones", precio: 1399, img: "https://via.placeholder.com/200?text=Poco+X6+Pro" },
      { id: 4, nombre: "Redmi 13C", categoria: "smartphones", precio: 499, img: "https://via.placeholder.com/200?text=Redmi+13C" },
      { id: 5, nombre: "Xiaomi Smart Band 8", categoria: "wearables", precio: 149, img: "https://via.placeholder.com/200?text=Band+8" },
      { id: 6, nombre: "Redmi Watch 4", categoria: "wearables", precio: 349, img: "https://via.placeholder.com/200?text=Redmi+Watch+4" },
      { id: 7, nombre: "Xiaomi Watch 2 Pro", categoria: "wearables", precio: 899, img: "https://via.placeholder.com/200?text=Watch+2+Pro" },
      { id: 8, nombre: "Redmi Buds 5", categoria: "audio", precio: 119, img: "https://via.placeholder.com/200?text=Buds+5" },
      { id: 9, nombre: "Redmi Buds 5 Pro", categoria: "audio", precio: 249, img: "https://via.placeholder.com/200?text=Buds+5+Pro" },
      { id: 10, nombre: "Xiaomi Sound Outdoor", categoria: "audio", precio: 179, img: "https://via.placeholder.com/200?text=Sound+Outdoor" },
      { id: 11, nombre: "Xiaomi Robot Vacuum S10", categoria: "hogar", precio: 849, img: "https://via.placeholder.com/200?text=Vacuum+S10" },
      { id: 12, nombre: "Mi Smart Air Fryer 3.5L", categoria: "hogar", precio: 299, img: "https://via.placeholder.com/200?text=Air+Fryer" },
      { id: 13, nombre: "Xiaomi Smart Camera C300", categoria: "hogar", precio: 139, img: "https://via.placeholder.com/200?text=Camera+C300" },
      { id: 14, nombre: "Xiaomi Electric Scooter 4", categoria: "hogar", precio: 1599, img: "https://via.placeholder.com/200?text=Scooter+4" },
      { id: 15, nombre: "Xiaomi Pad 6", categoria: "smartphones", precio: 1199, img: "https://via.placeholder.com/200?text=Pad+6" },
      { id: 16, nombre: "Redmi Pad SE", categoria: "smartphones", precio: 599, img: "https://via.placeholder.com/200?text=Pad+SE" },
      { id: 17, nombre: "Xiaomi Smart Kettle Pro", categoria: "hogar", precio: 189, img: "https://via.placeholder.com/200?text=Kettle+Pro" },
      { id: 18, nombre: "Xiaomi Power Bank 10000mAh", categoria: "audio", precio: 79, img: "https://via.placeholder.com/200?text=Power+Bank" },
      { id: 19, nombre: "Mi Body Composition Scale 2", categoria: "hogar", precio: 89, img: "https://via.placeholder.com/200?text=Scale+2" },
      { id: 20, nombre: "Xiaomi Lightbar Monitor", categoria: "hogar", precio: 159, img: "https://via.placeholder.com/200?text=Lightbar" }
    ];

    let carrito = [];

    function renderizarProductos(lista) {
      const contenedor = document.getElementById("gridProductos");
      contenedor.innerHTML = "";
      lista.forEach(p => {
        contenedor.innerHTML += `
          <div class="card">
            <img src="${p.img}" alt="${p.nombre}">
            <div>
              <span class="categoria">${p.categoria}</span>
              <h3>${p.nombre}</h3>
              <div class="precio">S/ ${p.precio.toFixed(2)}</div>
            </div>
            <button class="btn-add" onclick="agregarAlCarrito(${p.id})">Añadir al Carrito</button>
          </div>
        `;
      });
    }

    function filtrarCatálogo() {
      const texto = document.getElementById("searchInput").value.toLowerCase();
      const cat = document.getElementById("categoryFilter").value;

      const filtrados = productos.filter(p => {
        const coincideTexto = p.nombre.toLowerCase().includes(texto);
        const coincideCat = (cat === "todas" || p.categoria === cat);
        return coincideTexto && coincideCat;
      });

      renderizarProductos(filtrados);
    }

    function agregarAlCarrito(id) {
      const prod = productos.find(p => p.id === id);
      carrito.push(prod);
      actualizarCarrito();
    }

    function actualizarCarrito() {
      document.getElementById("cart-count").innerText = carrito.length;
      const cartList = document.getElementById("cartList");
      cartList.innerHTML = "";
      
      let total = 0;
      carrito.forEach((item, index) => {
        total += item.precio;
        cartList.innerHTML += `
          <div class="cart-item">
            <div>
              <strong>${item.nombre}</strong><br>
              <small>S/ ${item.precio.toFixed(2)}</small>
            </div>
            <button style="background:none; border:none; color:#ff4d4d; cursor:pointer;" onclick="eliminarDelCarrito(${index})">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        `;
      });

      document.getElementById("cartTotal").innerText = `Total: S/ ${total.toFixed(2)}`;
    }

    function eliminarDelCarrito(index) {
      carrito.splice(index, 1);
      actualizarCarrito();
    }

    function abrirModal() { document.getElementById("modalCart").classList.add("active"); }
    function cerrarModal() { document.getElementById("modalCart").classList.remove("active"); }

    function enviarWhatsApp(e) {
      e.preventDefault();
      if (carrito.length === 0) {
        alert("Tu carrito está vacío. Agrega al menos un producto.");
        return;
      }

      const tipoDoc = document.getElementById("tipoDoc").value;
      const numDoc = document.getElementById("numDoc").value;
      const nombre = document.getElementById("nombreCliente").value;

      let resumen = `*NUEVO PEDIDO - XIAOMI STORE AREQUIPA*\n`;
      resumen += `------------------------------------\n`;
      resumen += `*Cliente:* ${nombre}\n`;
      resumen += `*Comprobante:* ${tipoDoc} (${numDoc})\n\n`;
      resumen += `*Productos:*\n`;

      let total = 0;
      carrito.forEach(item => {
        resumen += `- ${item.nombre} (S/ ${item.precio.toFixed(2)})\n`;
        total += item.precio;
      });

      resumen += `\n*TOTAL A PAGAR: S/ ${total.toFixed(2)}*\n`;
      resumen += `------------------------------------\n`;
      resumen += `_Solicito coordinar la entrega y método de pago._`;

      const numTelefono = "51987654321"; // Reemplaza por tu número real de WhatsApp
      const url = `https://api.whatsapp.com/send?phone=${numTelefono}&text=${encodeURIComponent(resumen)}`;
      
      window.open(url, "_blank");
    }

    // Carga inicial
    renderizarProductos(productos);
  </script>
</body>
</html>
